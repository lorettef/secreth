    "tests/test_history_handlers.py",
    "tests/test_history_integration.py",
    "tests/test_membership_integration.py",
    "tests/test_models_integration.py",
    "tests/test_onboarding_handlers.py",
    "tests/test_session_handlers.py",
    "tests/test_sessions_integration.py",
    "tests/test_statistician_recovery_integration.py",
    "tests/test_stats_handlers.py",
    "tests/test_stats_integration.py",
]
